# 0xd9 能力位 —— 用友好开关，别手算掩码
#
# bit0 (0x1)  屏灭时不直接进 doze
# bit1 (0x2)  灵感接续（workshop AOD）
#             → SystemUI 写 Settings.Secure "oplus_keyguard_workshop_aod_support"
#             → Aod.apk 的 isSupportInspirationAod() 读它，决定显不显示「灵感接续」
# bit2 (0x4)  全景息屏（全屏 AOD）
#             → Settings.Secure "oplus_keyguard_panoramic_aod_support"

# 想要「灵感接续」就开这个
enable_inspiration = 1

# 想要「全景息屏」就开这个
enable_panoramic = 1

# 屏灭不渐暗直接进 doze，一般不要开
enable_no_doze_with_off = 0

# ---- 下面这些是给节点齐全的机器用的 ----

# feature 7 (OMMDPAOD) 写的节点。目标机没有也没关系，
# strict=0 时写失败只打日志、照样返回 0。
aod_light_mode_node = /sys/kernel/oplus_display/aod_light_mode_set

# feature 0xc0（AOD 局部刷新区域）写的节点，格式原样透传给内核
aod_area_node = /sys/kernel/oplus_display/aod_area

# getDisplayPanelInfo 返回的面板信息，随便填
panel_name = oplus_panel
panel_id = 0

# 1 = 节点写失败返回 -1（会让上层认为设置失败）
# 0 = 一律返回成功（stub 模式，推荐先用这个把 UI 跑通）
strict = 0
